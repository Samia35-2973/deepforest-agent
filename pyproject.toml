[project]
name = "deepforest_agent"
version = "0.1.0"
description = "AI Agent for DeepForest object detection"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    # Core dependencies
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "google-generativeai",
    "pydantic-settings",
    "pydantic",

    # Computer Vision
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",

    # DeepForest
    "deepforest",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "albumentations<2.0",

    # Data processing
    "pandas>=2.0.0",
    "pyyaml>=6.0",

    # Web interface
    "gradio>=4.0.0",
    "fastapi>=0.104.0",
    "requests>=2.31.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "shapely>=2.0.0",
    "scikit-image>=0.21.0",
    "tqdm>=4.65.0",

    # Additional
    "openai",
    "gradio_image_annotation"
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-profiling",
    "yapf"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
